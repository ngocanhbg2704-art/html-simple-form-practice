<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Bai tap Tao Form don gian</title><style>body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; } .form-container { background: white; padding: 25px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; } h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; } .form-group { margin-bottom: 15px; } .form-group label { display: block; font-weight: bold; margin-bottom: 5px; } .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="tel"], .form-group input[type="date"], .form-group select, .form-group textarea { width: 100%%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; } .radio-group, .checkbox-group { margin-top: 5px; } .radio-group label, .checkbox-group label { font-weight: normal; margin-right: 15px; display: inline-block; } .btn-group { margin-top: 20px; } input[type="submit"] { background-color: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; } input[type="reset"] { background-color: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-left: 10px; }</style></head><body><div class="form-container"><h2>Phan 1: Form So thich</h2><form action="#" method="POST"><div class="form-group"><label>Ho va ten:</label><input type="text" name="yourname" placeholder="Nhap ho va ten..." required/></div><div class="form-group"><label>Email:</label><input type="email" name="email" placeholder="Nhap email..." required/></div><div class="form-group"><label>So thich:</label><div class="checkbox-group"><label><input type="checkbox" name="hobby" value="sports"/> The thao</label><label><input type="checkbox" name="hobby" value="music"/> Am nhac</label><label><input type="checkbox" name="hobby" value="reading"/> Doc sach</label><label><input type="checkbox" name="hobby" value="travel"/> Du lich</label></div></div><div class="btn-group"><input type="submit" value="Gui thong tin"/><input type="reset" value="Nhap lai"/></div></form></div><div class="form-container"><h2>Phan 2: Form Dang ky hoc vien</h2><form action="#" method="POST"><div class="form-group"><label>Ho va ten:</label><input type="text" name="fullname" placeholder="Nhap ho va ten hoc vien..." required/></div><div class="form-group"><label>Email:</label><input type="email" name="email" placeholder="example@gmail.com" required/></div><div class="form-group"><label>So dien thoai:</label><input type="tel" name="phone" placeholder="0901234567"/></div><div class="form-group"><label>Ngay sinh:</label><input type="date" name="birthday"/></div><div class="form-group"><label>Gioi tinh:</label><div class="radio-group"><label><input type="radio" name="gender" value="male" checked/> Nam</label><label><input type="radio" name="gender" value="female"/> Nu</label><label><input type="radio" name="gender" value="other"/> Khac</label></div></div><div class="form-group"><label>Dia chi:</label><textarea name="address" rows="3" placeholder="Nhap dia chi cu tru..."></textarea></div><div class="form-group"><label>Khoa hoc:</label><select name="course"><option value="html_css">HTML & CSS</option><option value="javascript">JavaScript</option><option value="java">Java</option><option value="python">Python</option></select></div><div class="form-group"><label>Hinh thuc hoc:</label><div class="radio-group"><label><input type="radio" name="study_type" value="online" checked/> Online</label><label><input type="radio" name="study_type" value="offline"/> Offline</label></div></div><div class="form-group"><label>So thich:</label><div class="checkbox-group"><label><input type="checkbox" name="hobby" value="code"/> Lap trinh</label><label><input type="checkbox" name="hobby" value="game"/> Choi game</label><label><input type="checkbox" name="hobby" value="read"/> Doc sach</label></div></div><div class="form-group"><label>Ghi chu:</label><textarea name="note" rows="3" placeholder="Ghi chu them (neu co)..."></textarea></div><div class="btn-group"><input type="submit" value="Dang ky"/><input type="reset" value="Nhap lai"/></div></form></div></body></html>
